<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Auto Camera Capture</title>
<style>
body { background: #111; color: white; font-family: Arial; text-align:center; }
video { width: 90%; max-width: 450px; border-radius: 10px; margin-top: 20px; }
#countdown { font-size: 100px; margin-top: 20px; }
</style>
</head>
<body>

<h2>Auto Kamera & Kirim Email</h2>
<p>Website akan meminta izin kamera lalu memotret otomatis.</p>

<video id="video" autoplay></video>
<div id="countdown"></div>

<script>
const video = document.getElementById("video");
const countdown = document.getElementById("countdown");

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    video.srcObject = stream;
    startCountdown();
  });

function startCountdown() {
  let num = 3;
  countdown.innerText = num;

  let timer = setInterval(() => {
    num--;
    countdown.innerText = num;

    if (num === 0) {
      clearInterval(timer);
      takePhoto();
    }
  }, 1000);
}

function takePhoto() {
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  canvas.toBlob(sendPhoto, "image/jpeg");
}

function sendPhoto(blob) {
  const fd = new FormData();
  fd.append("photo", blob, "foto.jpg");

  fetch("/upload", {
    method: "POST",
    body: fd
  }).then(r => {
    alert("Foto terkirim ke email!");
  });
}
</script>
</body>
</html>
